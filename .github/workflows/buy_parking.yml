name: Buy UCLA Parking

on:
  schedule:
    # 7:00 AM Pacific = 2:00 PM UTC (Fri & Sat)
    - cron: "0 14 * * 5,6"
  workflow_dispatch:
    inputs:
      skip_prompt:
        description: "Skip Yes/No prompt and buy immediately"
        type: boolean
        default: false

jobs:
  buy-parking:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      UCLA_USERNAME: ${{ secrets.UCLA_USERNAME }}
      UCLA_PASSWORD: ${{ secrets.UCLA_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Send Telegram prompt and wait for response
        id: prompt
        if: ${{ github.event.inputs.skip_prompt != 'true' }}
        run: |
          python -c "
          import bot, json
          msg_id = bot.send_purchase_prompt()
          print(f'Sent prompt (message_id={msg_id})')
          result = bot.poll_for_response(msg_id)
          if result is True:
              print('User approved purchase')
          elif result is False:
              print('User declined purchase')
          else:
              print('No response received (timed out)')
          plate = None
          if result is True:
              plate = bot.ask_for_plate()
              if not plate:
                  print('No plate selected, skipping')
                  result = False
              else:
                  print(f'Plate selected: {plate}')
          with open('prompt_result.json', 'w') as f:
              json.dump({'approved': result is True, 'plate': plate}, f)
          "

      - name: Buy parking
        if: always()
        run: |
          python -c "
          import json, sys, os
          skip = os.environ.get('SKIP_PROMPT', 'false') == 'true'
          plate = '9VSK311'
          if skip:
              print('Prompt skipped — buying immediately')
              approved = True
              # Still ask for plate via Telegram
              import bot as _bot
              _plate = _bot.ask_for_plate()
              if _plate:
                  plate = _plate
          else:
              try:
                  result = json.load(open('prompt_result.json'))
                  approved = result.get('approved', False)
                  plate = result.get('plate', '9VSK311') or '9VSK311'
              except FileNotFoundError:
                  print('No prompt result found, skipping')
                  sys.exit(0)
          if not approved:
              print('Purchase not approved, skipping')
              sys.exit(0)
          import buy_parking, bot
          bot.send_message(f'Starting parking purchase (plate: {plate})...')
          success = buy_parking.run(headless=True, plate=plate)
          if success:
              bot.send_message('Parking purchased successfully!')
          else:
              bot.send_message('Parking purchase FAILED. Check workflow logs.')
              sys.exit(1)
          "
        env:
          SKIP_PROMPT: ${{ github.event.inputs.skip_prompt }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Send failure notification
        if: failure()
        run: |
          python -c "
          import bot
          bot.send_message('Parking workflow failed! Check GitHub Actions logs.')
          "
