name: Buy UCLA Parking

on:
  schedule:
    # 7:00 AM Pacific = 2:00 PM UTC (Fri & Sat)
    - cron: "0 14 * * 5,6"
  workflow_dispatch:
    inputs:
      skip_prompt:
        description: "Skip Yes/No prompt and buy immediately"
        type: boolean
        default: false

jobs:
  buy-parking:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Check if today is a class day
        id: datecheck
        run: |
          python -c "
          import config, datetime, os
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=-8))).strftime('%Y-%m-%d')
          is_manual = '${{ github.event_name }}' == 'workflow_dispatch'
          is_class_day = today in config.PARKING_DATES
          print(f'Today (PT): {today}, class day: {is_class_day}, manual: {is_manual}')
          if not is_class_day and not is_manual:
              print('Not a class day. Skipping.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'should_run={\"true\" if (is_class_day or is_manual) else \"false\"}\n')
          "

      - name: Run purchase flow for all users
        if: steps.datecheck.outputs.should_run == 'true'
        run: |
          python -c "
          import json, sys
          import bot, buy_parking
          from crypto_utils import load_users

          skip_prompt = '${{ github.event.inputs.skip_prompt }}' == 'true'
          users = load_users()
          if not users:
              print('No registered users found.')
              sys.exit(0)

          print(f'Found {len(users)} registered user(s)')

          # Step 1: Send prompts to all users (unless skipping)
          if skip_prompt:
              approved_users = {str(u['telegram_chat_id']): True for u in users}
          else:
              prompts = bot.send_purchase_prompts(users)
              print(f'Sent prompts to {len(prompts)} users, waiting for responses...')
              responses = bot.poll_all_responses(prompts)
              approved_users = {cid: ans for cid, ans in responses.items() if ans}
              print(f'{len(approved_users)} user(s) approved')

          if not approved_users:
              print('No users approved. Done.')
              sys.exit(0)

          # Step 2: For each approved user, ask plate then buy
          user_map = {str(u['telegram_chat_id']): u for u in users}
          failed = False
          for chat_id in approved_users:
              user = user_map[chat_id]
              name = user['ucla_username']
              print(f'--- Processing {name} ---')

              # Ask for plate
              plates = user.get('plates', [user['default_plate']] if 'default_plate' in user else [])
              plate = bot.ask_for_plate(chat_id, plates)
              if not plate:
                  bot.send_message(chat_id, 'No plate selected. Skipping.')
                  continue

              # Ask for parking structure
              structure = bot.ask_for_structure(chat_id)

              bot.send_message(chat_id, f'Purchasing Yellow 1-Day pass ($8.01)\nPlate: {plate}\n\nStarting now...')

              success = buy_parking.run(
                  username=user['ucla_username'],
                  password=user['ucla_password'],
                  plate=plate,
                  structure=structure,
                  chat_id=chat_id,
                  headless=True,
              )

              if success:
                  bot.send_message(chat_id, 'Parking purchased successfully!')
              else:
                  bot.send_message(chat_id, 'Parking purchase FAILED. Ask DJ to check logs.')
                  failed = True

          if failed:
              sys.exit(1)
          "

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
