name: Buy UCLA Parking

on:
  schedule:
    # Fire 2 hours early to absorb GitHub Actions cron delays.
    # Script sleeps until exactly 6:00 AM Pacific before sending prompts.
    # PST (Nov–Mar): 4 AM PST = 12:00 PM UTC
    - cron: "0 12 * * 3,5,6"
    # PDT (Mar–Nov): 4 AM PDT = 11:00 AM UTC
    - cron: "0 11 * * 3,5,6"
    # August Block 2026 (Mon/Tue/Thu 8/10, 8/11, 8/13) — in-person, not the usual Wed/Fri/Sat/Sun schedule.
    # PARKING_DATES gates the actual run, so this is safe to leave in place afterward.
    - cron: "0 12 10,11,13 8 *"
    - cron: "0 11 10,11,13 8 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip wake+push (test datecheck only)"
        type: boolean
        default: false

concurrency:
  group: buy-parking
  cancel-in-progress: true

jobs:
  buy-parking:
    runs-on: ubuntu-latest
    timeout-minutes: 130

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Check if today is a class day
        id: datecheck
        run: |
          python -c "
          import config, datetime, os
          from zoneinfo import ZoneInfo
          pacific = ZoneInfo('America/Los_Angeles')
          now = datetime.datetime.now(pacific)
          today = now.strftime('%Y-%m-%d')
          current_hour = now.hour
          is_manual = '${{ github.event_name }}' == 'workflow_dispatch'
          is_class_day = today in config.PARKING_DATES

          # Deduplicate: two cron triggers cover PST and PDT.
          # Only proceed if we're within 90 min of the 6 AM target (handles DST edge cases).
          target = now.replace(hour=6, minute=0, second=0, microsecond=0)
          minutes_to_target = abs((target - now).total_seconds()) / 60
          if not is_manual and minutes_to_target > 150:
              print(f'Dedup: {minutes_to_target:.0f} min from 6 AM target. Skipping this cron trigger.')
              is_class_day = False

          print(f'Today (PT): {today}, hour: {current_hour}, class day: {is_class_day}, manual: {is_manual}')
          if not is_class_day and not is_manual:
              print('Not a class day. Skipping.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'should_run={\"true\" if (is_class_day or is_manual) else \"false\"}\n')
          "

      - name: Wait until 6:00 AM Pacific
        if: steps.datecheck.outputs.should_run == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          python -c "
          import datetime, time
          from zoneinfo import ZoneInfo
          pacific = ZoneInfo('America/Los_Angeles')
          now = datetime.datetime.now(pacific)
          target = now.replace(hour=6, minute=0, second=0, microsecond=0)
          if now < target:
              wait_secs = (target - now).total_seconds()
              print(f'Current time: {now.strftime(\"%H:%M:%S\")} PT')
              print(f'Waiting {wait_secs:.0f} seconds until 6:00 AM PT...')
              time.sleep(wait_secs)
          print(f'Ready! Time: {datetime.datetime.now(pacific).strftime(\"%H:%M:%S\")} PT')
          "

      - name: Wake server and send push notification
        id: push
        if: steps.datecheck.outputs.should_run == 'true' && github.event.inputs.dry_run != 'true'
        env:
          JUSTIN_URL: ${{ secrets.JUSTIN_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: |
          python - <<'PYEOF'
          import os, sys, time, urllib.request, json, datetime
          from zoneinfo import ZoneInfo

          url    = os.environ['JUSTIN_URL'].rstrip('/')
          secret = os.environ['PUSH_SECRET']

          print('Waking Railway server...')
          server_up = False
          for attempt in range(12):
              try:
                  urllib.request.urlopen(url + '/ping', timeout=10)
                  print('Server is up.')
                  server_up = True
                  break
              except Exception as e:
                  print(f'  attempt {attempt+1}: {e}')
                  time.sleep(10)

          if not server_up:
              print('ERROR: Server did not respond after 12 attempts.')
              sys.exit(1)

          # Send push notification (message varies by day)
          import config
          today = datetime.datetime.now(ZoneInfo('America/Los_Angeles')).strftime('%Y-%m-%d')
          is_elective = today in config.ELECTIVE_DATES
          is_august_block = today in config.AUGUST_BLOCK_DATES
          is_biweekly_only = today in config.BIWEEKLY_ONLY_DATES
          special_day = config.SPECIAL_DAYS.get(today)
          if special_day:
              body = f'Tap to open Justin and buy parking for today. Good luck on {special_day}!'
          elif is_august_block:
              body = "Tap to open Justin and buy parking for today — if you're enrolled in August Block."
          elif is_elective:
              body = "Tap to open Justin and buy parking for today — if you're taking an elective."
          elif is_biweekly_only:
              body = "Tap to open Justin and buy parking for today — Bi-Weekly students only."
          else:
              body = 'Tap to open Justin and buy parking for today — Bi-Weekly + Monthly students.'
          req = urllib.request.Request(
              url + '/api/send-push',
              data=json.dumps({
                  'title': "It's a School Day!",
                  'body':  body,
              }).encode(),
              headers={'Content-Type': 'application/json', 'X-Push-Secret': secret},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              result = json.loads(resp.read())
          print(f'Push result: {result}')

          if result.get('sent', 0) == 0:
              print('ERROR: Push sent to 0 subscribers — subscription may have expired.')
              sys.exit(1)
          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
