name: Buy UCLA Parking

on:
  schedule:
    # Fire early to absorb GitHub Actions cron delays.
    # Script sleeps until exactly 6:00 AM Pacific before sending prompts.
    # PST (Nov–Mar): 5 AM PST = 1:00 PM UTC
    - cron: "0 13 * * 5,6"
    # PDT (Mar–Nov): 5 AM PDT = 12:00 PM UTC
    - cron: "0 12 * * 5,6"
  workflow_dispatch:
    inputs:
      skip_prompt:
        description: "Skip Yes/No prompt and buy immediately"
        type: boolean
        default: false

concurrency:
  group: buy-parking
  cancel-in-progress: false

jobs:
  buy-parking:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Check if today is a class day
        id: datecheck
        run: |
          python -c "
          import config, datetime, os
          from zoneinfo import ZoneInfo
          pacific = ZoneInfo('America/Los_Angeles')
          now = datetime.datetime.now(pacific)
          today = now.strftime('%Y-%m-%d')
          current_hour = now.hour
          is_manual = '${{ github.event_name }}' == 'workflow_dispatch'
          is_class_day = today in config.PARKING_DATES

          # Deduplicate: two cron triggers cover PST and PDT.
          # Only proceed if we're within 90 min of the 6 AM target (handles DST edge cases).
          target = now.replace(hour=6, minute=0, second=0, microsecond=0)
          minutes_to_target = abs((target - now).total_seconds()) / 60
          if not is_manual and minutes_to_target > 90:
              print(f'Dedup: {minutes_to_target:.0f} min from 6 AM target. Skipping this cron trigger.')
              is_class_day = False

          print(f'Today (PT): {today}, hour: {current_hour}, class day: {is_class_day}, manual: {is_manual}')
          if not is_class_day and not is_manual:
              print('Not a class day. Skipping.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'should_run={\"true\" if (is_class_day or is_manual) else \"false\"}\n')
          "

      - name: Wait until 6:00 AM Pacific
        if: steps.datecheck.outputs.should_run == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          python -c "
          import datetime, time
          from zoneinfo import ZoneInfo
          pacific = ZoneInfo('America/Los_Angeles')
          now = datetime.datetime.now(pacific)
          target = now.replace(hour=6, minute=0, second=0, microsecond=0)
          if now < target:
              wait_secs = (target - now).total_seconds()
              print(f'Current time: {now.strftime(\"%H:%M:%S\")} PT')
              print(f'Waiting {wait_secs:.0f} seconds until 6:00 AM PT...')
              time.sleep(wait_secs)
          print(f'Ready! Time: {datetime.datetime.now(pacific).strftime(\"%H:%M:%S\")} PT')
          "

      - name: Run purchase flow for all users
        if: steps.datecheck.outputs.should_run == 'true'
        run: |
          python -c "
          import json, sys, concurrent.futures
          import bot, buy_parking
          from crypto_utils import load_users

          skip_prompt = '${{ github.event.inputs.skip_prompt }}' == 'true'
          users = load_users()
          if not users:
              print('No registered users found.')
              sys.exit(0)

          print(f'Found {len(users)} registered user(s)')

          # Step 1: Send prompts to all users (unless skipping)
          if skip_prompt:
              approved_users = {str(u['telegram_chat_id']): True for u in users}
          else:
              prompts = bot.send_purchase_prompts(users)
              print(f'Sent prompts to {len(prompts)} users, waiting for responses...')
              responses = bot.poll_all_responses(prompts)
              approved_users = {cid: ans for cid, ans in responses.items() if ans}
              print(f'{len(approved_users)} user(s) approved')

          if not approved_users:
              print('No users approved. Done.')
              sys.exit(0)

          # Step 2: Collect plate and structure from each user
          user_map = {str(u['telegram_chat_id']): u for u in users}
          purchase_queue = []

          for chat_id in approved_users:
              user = user_map[chat_id]
              name = user['ucla_username']
              print(f'--- Collecting info for {name} ---')

              plates = user.get('plates', [user['default_plate']] if 'default_plate' in user else [])
              plate = bot.ask_for_plate(chat_id, plates)
              if not plate:
                  bot.send_message(chat_id, 'No plate selected. Skipping.')
                  continue

              structure = bot.ask_for_structure(chat_id)

              # Confirmation step
              if not bot.ask_for_confirmation(chat_id, plate, structure):
                  bot.send_message(chat_id, 'Purchase cancelled.')
                  continue

              bot.send_message(chat_id, 'Starting purchase now...')
              purchase_queue.append((chat_id, user, plate, structure))

          # Step 3: Run purchases (parallel if multiple users)
          failed = False

          def do_purchase(args):
              cid, usr, plt, struct = args
              result = buy_parking.run(
                  username=usr['ucla_username'],
                  password=usr['ucla_password'],
                  plate=plt,
                  structure=struct,
                  chat_id=cid,
                  headless=True,
              )
              if result:
                  bot.send_success(cid, result)
              return result is not None

          if len(purchase_queue) == 1:
              if not do_purchase(purchase_queue[0]):
                  failed = True
          elif len(purchase_queue) > 1:
              with concurrent.futures.ThreadPoolExecutor(max_workers=len(purchase_queue)) as pool:
                  results = pool.map(do_purchase, purchase_queue)
                  if not all(results):
                      failed = True

          if failed:
              sys.exit(1)
          "

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
