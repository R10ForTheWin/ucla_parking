name: Test Run (Dry Run)

on:
  schedule:
    # One-time test: Wed Feb 18, 2026 at 6 AM PST (14:00 UTC). Remove after.
    - cron: "0 14 18 2 *"
  workflow_dispatch:

jobs:
  test-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run test (dry run)
        run: |
          python -c "
          import sys
          import bot, buy_parking
          from crypto_utils import load_users

          users = load_users()
          if not users:
              print('No registered users.')
              sys.exit(0)

          # Step 1: Send prompts
          prompts = bot.send_purchase_prompts(users)
          print(f'Sent prompts to {len(prompts)} user(s)')
          responses = bot.poll_all_responses(prompts)
          approved = {cid: ans for cid, ans in responses.items() if ans}

          if not approved:
              print('No users approved.')
              sys.exit(0)

          user_map = {str(u['telegram_chat_id']): u for u in users}
          for chat_id in approved:
              user = user_map[chat_id]

              # Step 2: Plate
              plates = user.get('plates', [])
              plate = bot.ask_for_plate(chat_id, plates)
              if not plate:
                  continue

              # Step 3: Structure
              structure = bot.ask_for_structure(chat_id)

              # Step 4: Confirmation
              if not bot.ask_for_confirmation(chat_id, plate, structure):
                  bot.send_message(chat_id, 'Test cancelled.')
                  continue

              bot.send_message(chat_id, 'Starting dry run now...')

              # Step 5: Run with DRY RUN
              result = buy_parking.run(
                  username=user['ucla_username'],
                  password=user['ucla_password'],
                  plate=plate,
                  structure=structure,
                  chat_id=chat_id,
                  headless=True,
                  dry_run=True,
              )

              if result:
                  bot.send_success(chat_id, 'DRY RUN complete! No purchase was made.\n\nThis was a test — the real thing will look exactly like this.')
          "

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
