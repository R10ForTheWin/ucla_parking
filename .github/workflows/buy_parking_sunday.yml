name: Buy UCLA Parking (Sunday EVI)

on:
  schedule:
    # Fire 2 hours early to absorb GitHub Actions cron delays.
    # Script sleeps until exactly 6:00 AM Pacific before sending prompts.
    # All EVI dates fall in PDT (Mar–Nov): 4 AM PDT = 11:00 AM UTC
    - cron: "0 11 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip wake+push (test datecheck only)"
        type: boolean
        default: false

concurrency:
  group: buy-parking-sunday
  cancel-in-progress: false

jobs:
  buy-parking-sunday:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Check if today is an EVI class day
        id: datecheck
        run: |
          python -c "
          import datetime, os
          from zoneinfo import ZoneInfo
          pacific = ZoneInfo('America/Los_Angeles')
          now = datetime.datetime.now(pacific)
          today = now.strftime('%Y-%m-%d')
          is_manual = '${{ github.event_name }}' == 'workflow_dispatch'
          EVI_DATES = {'2026-04-12', '2026-05-10', '2026-05-31'}
          is_class_day = today in EVI_DATES

          # Deduplicate: only proceed if within 150 min of 6 AM target.
          target = now.replace(hour=6, minute=0, second=0, microsecond=0)
          minutes_to_target = abs((target - now).total_seconds()) / 60
          if not is_manual and minutes_to_target > 150:
              print(f'Dedup: {minutes_to_target:.0f} min from 6 AM target. Skipping.')
              is_class_day = False

          print(f'Today (PT): {today}, hour: {now.hour}, EVI class day: {is_class_day}, manual: {is_manual}')
          if not is_class_day and not is_manual:
              print('Not an EVI class day. Skipping.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'should_run={\"true\" if (is_class_day or is_manual) else \"false\"}\n')
          "

      - name: Wait until 6:00 AM Pacific
        if: steps.datecheck.outputs.should_run == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          python -c "
          import datetime, time
          from zoneinfo import ZoneInfo
          pacific = ZoneInfo('America/Los_Angeles')
          now = datetime.datetime.now(pacific)
          target = now.replace(hour=6, minute=0, second=0, microsecond=0)
          if now < target:
              wait_secs = (target - now).total_seconds()
              print(f'Current time: {now.strftime(\"%H:%M:%S\")} PT')
              print(f'Waiting {wait_secs:.0f} seconds until 6:00 AM PT...')
              time.sleep(wait_secs)
          print(f'Ready! Time: {datetime.datetime.now(pacific).strftime(\"%H:%M:%S\")} PT')
          "

      - name: Wake server and send push notification
        id: push
        if: steps.datecheck.outputs.should_run == 'true' && github.event.inputs.dry_run != 'true'
        env:
          JUSTIN_URL: ${{ secrets.JUSTIN_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: |
          python - <<'PYEOF'
          import os, sys, time, urllib.request, json

          url    = os.environ['JUSTIN_URL'].rstrip('/')
          secret = os.environ['PUSH_SECRET']

          print('Waking Railway server...')
          server_up = False
          for attempt in range(12):
              try:
                  urllib.request.urlopen(url + '/ping', timeout=10)
                  print('Server is up.')
                  server_up = True
                  break
              except Exception as e:
                  print(f'  attempt {attempt+1}: {e}')
                  time.sleep(10)

          if not server_up:
              print('ERROR: Server did not respond after 12 attempts.')
              sys.exit(1)

          req = urllib.request.Request(
              url + '/api/send-push',
              data=json.dumps({
                  'title': "It's a School Day!",
                  'body':  'Tap to open Justin and buy parking for today. (electives day)'
              }).encode(),
              headers={'Content-Type': 'application/json', 'X-Push-Secret': secret},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              result = json.loads(resp.read())
          print(f'Push result: {result}')

          if result.get('sent', 0) == 0:
              print('ERROR: Push sent to 0 subscribers — subscription may have expired.')
              sys.exit(1)
          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
